spring.application.name=fleetmanager

# ==========================================
# PostgreSQL Database Configuration
# ==========================================
# Connects to localhost:5432/fleetdb by default.
# You can change username/password or database name here.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fleetdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:Vimal@1928}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / Hibernate Settings
# ==========================================
# 'update' automatically creates and updates the 'robots' table in PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Spring Actuator Health Check
# ==========================================
# Shows complete database connection health at /actuator/health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
