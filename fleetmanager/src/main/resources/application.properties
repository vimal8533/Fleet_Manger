spring.application.name=fleetmanager

# ==========================================
# Server Configuration (Render & Cloud Ports)
# ==========================================
server.port=${PORT:10000}
server.address=0.0.0.0

# ==========================================
# PostgreSQL Database Configuration
# ==========================================
# Uses standard DB_* environment variables provided by Render
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fleetdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / Hibernate Settings
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==========================================
# Spring Actuator Health & Security
# ==========================================
# Exposes basic health check for Render liveness probes
# Details are hidden to protect database URLs and system info
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ==========================================
# Robot Control API Security
# ==========================================
# When ROBOT_API_KEY is defined in environment, mutating endpoints require X-API-KEY header
robot.security.api-key=${ROBOT_API_KEY:}
