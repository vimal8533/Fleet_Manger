# Test configuration using in-memory H2 with PostgreSQL compatibility mode
spring.datasource.url=jdbc:h2:mem:fleettest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable scheduled background loops during unit tests
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
